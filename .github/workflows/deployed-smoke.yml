name: Deployed Smoke Tests

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Full deployment URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployed-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Test Deployed Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployment URL
        shell: bash
        run: |
          if [[ "$DEPLOYMENT_URL" != https://* ]]; then
            echo "DEPLOYMENT_URL must start with https://"
            exit 1
          fi

          if [[ "$DEPLOYMENT_URL" == https://vercel.com/* ]]; then
            echo "Use the deployed .vercel.app domain, not the Vercel dashboard URL."
            exit 1
          fi

          echo "Testing deployment: $DEPLOYMENT_URL"

      - name: Run deployed smoke tests
        run: npm run test:deployed

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: deployed-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failed test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: deployed-test-results
          path: test-results/
          retention-days: 14